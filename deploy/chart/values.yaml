image:
  repository: ghcr.io/gabriels562/calibration-drift-detection
  tag: main
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: NodePort
  port: 8000
  nodePort: 30800

# MLflow holds the model registry and therefore the approval state.
# Single replica with a PVC: the registry is the audit backbone, so it is
# stateful by design and must not be horizontally scaled behind SQLite.
mlflow:
  enabled: true
  # Pinned to the same version as the client in uv.lock. Skew between the
  # process that trains and the registry that records it is a traceability
  # hazard, not just a compatibility one: a request the server misreads is a
  # record that does not match what was run.
  image: ghcr.io/mlflow/mlflow:v3.16.1
  port: 5000
  storage: 5Gi
  nodePort: 30500
  # MLflow 3 rejects unrecognised Host headers (DNS-rebinding protection).
  # Its default allowlist is localhost plus RFC1918, and Tailscale addresses
  # are CGNAT (100.64.0.0/10), so the node's Tailscale address is named
  # explicitly. Widen this list deliberately; do not use --disable-security.
  workers: 1
  allowedHosts: "localhost:5000,127.0.0.1:5000,localhost:30500,127.0.0.1:30500,100.89.153.112:30500,calibration-drift-mlflow:5000,calibration-drift-mlflow.calibration-drift.svc.cluster.local:5000"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

mlflowResources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Prometheus Operator ServiceMonitor. kube-prometheus-stack is installed on
# the cluster, so scraping is on.
serviceMonitor:
  enabled: true
  interval: 30s

networkPolicy:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
