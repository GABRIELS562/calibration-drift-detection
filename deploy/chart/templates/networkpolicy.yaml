{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "calibration-drift.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "calibration-drift.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Scraping and user traffic reach the API; nothing else does.
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8000
          protocol: TCP
  egress:
    # The API talks to MLflow and to DNS. It has no reason to reach anything
    # else, and a model-serving pod with open egress is an exfiltration path.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlflow
      ports:
        - port: {{ .Values.mlflow.port }}
          protocol: TCP
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
